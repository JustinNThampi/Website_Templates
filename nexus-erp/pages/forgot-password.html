<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ERP — Reset Password</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <a href="../index.html" class="auth-logo">
          <div class="brand-icon">N</div>
          <div class="auth-logo-text">
            <strong>NEXUS</strong>
            <span>ERP SYSTEM</span>
          </div>
        </a>

        <h1>Reset Password</h1>
        <p>Enter your verified email to receive secure recovery instructions</p>
      </div>

      <form class="auth-form" id="forgotForm">
        <div class="form-group">
          <label for="resetEmail">Registered Work Email</label>
          <input
            type="email"
            id="resetEmail"
            placeholder="admin@nexuserp.com"
            required
            autocomplete="email"
          >
        </div>

        <button type="submit" class="primary-button auth-submit-btn" id="resetBtn">
          Send Recovery Link →
        </button>

        <div id="resetFeedback" style="display: none; padding: 12px; background: var(--success-light); border: 1px solid var(--success); border-radius: var(--radius-md); font-size: 12px; color: var(--success); line-height: 1.5; text-align: center;">
          ✓ A password reset link has been dispatched to your email address. Check your inbox or spam folder.
        </div>
      </form>

      <div class="auth-footer">
        Remember your password?
        <a href="login.html" class="auth-link">Return to Sign In</a>
      </div>

    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById("forgotForm")?.addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("resetBtn");
      const feedback = document.getElementById("resetFeedback");

      btn.textContent = "Sending instructions...";
      btn.disabled = true;

      setTimeout(() => {
        btn.style.display = "none";
        feedback.style.display = "block";
        showToast("Instructions Dispatched", "Check your inbox for reset instructions.", "success");
      }, 700);
    });
  </script>
</body>
</html>
