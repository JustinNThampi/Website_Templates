<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ERP — Create Workspace</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <a href="../index.html" class="auth-logo">
          <div class="brand-icon">N</div>
          <div class="auth-logo-text">
            <strong>NEXUS</strong>
            <span>ERP SYSTEM</span>
          </div>
        </a>

        <h1>Register Workspace</h1>
        <p>Set up your company ERP organization in seconds</p>
      </div>

      <form class="auth-form" id="registerForm">
        <div class="modal-grid-2">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              placeholder="Alexander Vance"
              required
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="companyName">Company Name</label>
            <input
              type="text"
              id="companyName"
              placeholder="Vance Enterprises LLC"
              required
              autocomplete="organization"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="workEmail">Work Email</label>
          <input
            type="email"
            id="workEmail"
            placeholder="alexander@vance.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="modal-grid-2">
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input
              type="password"
              id="regPassword"
              placeholder="At least 8 characters"
              required
            >
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repeat password"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="industry">Industry Vertical</label>
          <select id="industry">
            <option>Wholesale & Distribution</option>
            <option>Manufacturing & Industrial</option>
            <option>Retail & E-commerce</option>
            <option>Logistics & Supply Chain</option>
            <option>Professional Services</option>
          </select>
        </div>

        <div class="auth-form-row">
          <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; color: var(--text-secondary); font-size: 11px;">
            <input type="checkbox" required style="margin-top: 2px;">
            <span>I agree to the Nexus ERP Terms of Service, Privacy Policy, and Data Processing Agreement</span>
          </label>
        </div>

        <button type="submit" class="primary-button auth-submit-btn" id="regSubmitBtn">
          Create Workspace & Launch ERP →
        </button>
      </form>

      <div class="auth-footer">
        Already have an enterprise account?
        <a href="login.html" class="auth-link">Sign In</a>
      </div>

    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById("registerForm")?.addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("regSubmitBtn");
      btn.textContent = "Setting up workspace...";
      btn.disabled = true;

      setTimeout(() => {
        showToast("Workspace Provisioned", "Organization created successfully! Redirecting to Dashboard...", "success");
        setTimeout(() => {
          window.location.href = "../index.html";
        }, 1000);
      }, 900);
    });
  </script>
</body>
</html>
