<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ERP — 404 Page Not Found</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="error-body">

  <div class="error-card">
    <div class="error-badge">404</div>

    <h1>Resource Not Found</h1>

    <p>
      The page, invoice, order, or document you are trying to reach does not exist,
      has been archived, or was moved to another department.
    </p>

    <div class="search-box" style="margin-bottom: 24px; max-width: 320px; margin-left: auto; margin-right: auto;">
      <span>⌕</span>
      <input
        type="text"
        placeholder="Search orders, invoices, customers..."
        id="globalSearch"
      >
      <kbd>⌘ K</kbd>
    </div>

    <div class="error-actions">
      <a href="../index.html" class="primary-button">
        ⌂ Back to Dashboard
      </a>

      <a href="reports.html" class="secondary-button">
        ▥ View Reports
      </a>
    </div>

    <div style="margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border-light); font-size: 11px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--success);"></span>
      All Nexus ERP Core Services Operational • v2.4.0
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
